<!doctype html>
<html lang="ko">
  <head>
    <!-- 문자 인코딩과 화면 크기 설정: 한국어와 모바일 화면을 올바르게 표시합니다. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 브라우저 탭에 표시되는 앱 이름입니다. -->
    <title>Hello World!</title>
  </head>
  <body>
    <!-- 페이지의 핵심 제목입니다. style 속성은 제목 글자색을 파란색으로 지정합니다. -->
    <h1 style="color: blue">Hello World!</h1>
    <!-- 제목 아래에 표시되는 간단한 소개 문구입니다. -->
    <p>I'm Jae Seung Lee</p>
  </body>
</html>
